services:
  # ----------------------------------------------------------------------------
  # 1. SERVICE BACKEND API (Express + Node.js)
  # ----------------------------------------------------------------------------
  - type: web
    name: burundi-food-price-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        value: https://jvjxrknwbnsvgnobbfwa.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # A renseigner dans le dashboard Render pour sécurité
      - key: CORS_ORIGIN
        value: https://burundi-food-price.vercel.app,http://localhost:3000

  # ----------------------------------------------------------------------------
  # 2. SERVICE FRONTEND WEB (Optionnel si heberge sur Render Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: burundi-food-price-web
    runtime: static
    rootDir: frontend
    buildCommand: bun install && bun run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_PROJECT_ID
        value: jvjxrknwbnsvgnobbfwa
      - key: VITE_SUPABASE_URL
        value: https://jvjxrknwbnsvgnobbfwa.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
