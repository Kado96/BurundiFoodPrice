services:
  # ----------------------------------------------------------------------------
  # 1. SERVICE BACKEND API (Express + Node.js)
  # ----------------------------------------------------------------------------
  - type: web
    name: burundi-food-price-api
    runtime: node
    rootDir: backend
    # free = sleep après ~15 min → 502 admin. Preferer starter si budget OK.
    # Keep-alive GitHub Actions (.github/workflows/keep-api-warm.yml) mitige le sleep free.
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        value: https://jvjxrknwbnsvgnobbfwa.supabase.co
      # Clé publique anon (requise pour requireAdmin / getUser) — pas un secret
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2anhya253Ym5zdmdub2JiZndhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNjgxMzksImV4cCI6MjEwNzc0NDEzOX0.6BU65OVL_jcuc29NnWcQ7WiT53txB5aES8aFY4Z8ong
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # A renseigner dans le dashboard Render pour sécurité
      - key: FRONTEND_URL
        value: https://burundi-food-price.vercel.app
      - key: CORS_ORIGIN
        value: https://burundi-food-price.vercel.app,http://localhost:3000,https://localhost,http://localhost,capacitor://localhost
      - key: GMAIL_USER
        value: quicksales.bi@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: GMAIL_APP_PASSWORD
        sync: false

  # ----------------------------------------------------------------------------
  # 2. SERVICE FRONTEND WEB (Optionnel si heberge sur Render Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: burundi-food-price-web
    runtime: static
    rootDir: frontend
    buildCommand: bun install && bun run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_PROJECT_ID
        value: jvjxrknwbnsvgnobbfwa
      - key: VITE_SUPABASE_URL
        value: https://jvjxrknwbnsvgnobbfwa.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2anhya253Ym5zdmdub2JiZndhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNjgxMzksImV4cCI6MjEwNzc0NDEzOX0.6BU65OVL_jcuc29NnWcQ7WiT53txB5aES8aFY4Z8ong
      - key: VITE_API_URL
        value: https://burundi-food-price-api.onrender.com
