# DÉSACTIVÉ — GitHub Actions facture / bloque le compte gratuit.
# Déploiement n8n = local uniquement (gratuit) :
#   npm run n8n:deploy
#
# Les emails (alertes + rapports) passent par Apps Script Gmail,
# pas par GitHub. Voir n8n/README.md
name: Deploy n8n workflows (prod)

on:
  workflow_dispatch:
    # Manuel uniquement si tu réactives un jour (pas de push auto)

jobs:
  deploy-n8n:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Wake n8n + deploy & activate
        env:
          N8N_BASE_URL: https://n8n-ajs5.onrender.com
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          BFP_GMAIL_RELAY_URL: ${{ vars.BFP_GMAIL_RELAY_URL }}
          BFP_GMAIL_RELAY_SECRET: ${{ secrets.BFP_GMAIL_RELAY_SECRET }}
        run: node scripts/deploy-n8n-workflows.mjs
